name: Apptainer Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'examples/hello_pytorch/pixi.toml'
      - 'examples/hello_pytorch/pixi.lock'
      - 'examples/hello_pytorch/apptainer.def'
      - 'examples/hello_pytorch/src/torch_detect_GPU.py'
  pull_request:
    paths:
      - 'examples/hello_pytorch/pixi.toml'
      - 'examples/hello_pytorch/pixi.lock'
      - 'examples/hello_pytorch/apptainer.def'
      - 'examples/hello_pytorch/src/torch_detect_GPU.py'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  apptainer:
    name: Build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2

      - name: Build container from definition file
        working-directory: ./examples/hello_pytorch
        run: apptainer build pixi-docker-chtc.sif apptainer.def

      - name: Test container
        working-directory: ./examples/hello_pytorch
        run: apptainer test pixi-docker-chtc.sif

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy built container
        if: github.event_name != 'pull_request'
        working-directory: ./examples/hello_pytorch
        run: |
          short_sha="${GITHUB_SHA::7}"
          # OCI registry paths must be lowercase, but GITHUB_REPOSITORY preserves the org's case
          registry="oras://ghcr.io/${GITHUB_REPOSITORY,,}"
          apptainer push pixi-docker-chtc.sif "${registry}:apptainer-hello-pytorch-noble-cuda-12.9"
          apptainer push pixi-docker-chtc.sif "${registry}:apptainer-sha-${short_sha}"
